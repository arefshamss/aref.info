<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aref Shamspour</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/style.css" />
    <!--Favicon-->
    <link rel="icon" href="images/favicon.png" type="image/x-icon" />
    <script
      defer
      src="https://code.iconify.design/iconify-icon/2.2.0/iconify-icon.min.js"
    ></script>
  </head>
  <body>
    <!-- Background Layer (fix for iOS Safari) -->
    <div class="background-layer"></div>
    <!-- Animated Background -->
    <div class="bg-animation">
      <div class="floating-shape shape1"></div>
      <div class="floating-shape shape2"></div>
      <div class="floating-shape shape3"></div>
    </div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Container -->
    <div class="container">
      <div class="glass-card">
        <!-- Profile Picture -->
        <div class="profile-container">
          <img
            src="/images/user.png"
            alt="Aref Shamspour"
            class="profile-pic"
          />
        </div>

        <!-- Name -->
        <h1 class="name">Aref Shamspour</h1>

        <!-- Title -->
        <p class="title">Web Developer</p>

        <!-- Main Button -->
        <a
          href="https://t.me/arefshamss"
          target="_blank"
          title="Telegram"
          class="main-btn"
        >
          <span>Reach Out Via Telegram</span>

          <iconify-icon
            class="icon"
            icon="icon-park-outline:telegram"
          ></iconify-icon>
        </a>

        <!-- Social Media Links -->
        <div class="social-links">
          <a
            href="https://github.com/arefshamss"
            target="_blank"
            class="social-link"
            title="Github"
          >
            <iconify-icon class="icon" icon="bi:github"></iconify-icon>
          </a>
          <!-- <a
            href="https://www.linkedin.com/in/arefshamspour"
            target="_blank"
            class="social-link"
            title="LinkedIn"
          >
            <i class="fab fa-linkedin"></i>
          </a> -->
          <a
            href="https://www.youtube.com/@arefshamss?sub_confirmation=1"
            target="_blank"
            class="social-link"
            title="Youtube"
          >
            <iconify-icon class="icon" icon="bi:youtube"></iconify-icon>
          </a>
          <a
            href="https://instagram.com/arefshamss"
            target="_blank"
            class="social-link"
            title="Instagram"
          >
            <iconify-icon class="icon" icon="bi:instagram"></iconify-icon>
          </a>
          <a
            href="mailto:sh.aref@ymail.com"
            target="_blank"
            class="social-link"
            title="Email"
          >
            <iconify-icon class="icon" icon="fa6-solid:envelope"></iconify-icon>
          </a>
        </div>
      </div>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
